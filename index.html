<div id="meme-container" style="text-align: center; font-family: 'Arial', sans-serif; padding: 20px;">
    <!-- Custom Cat Meme GIF -->
    <img src="https://media.tenor.com/kkxWF2DrTRIAAAAj/cat-meme-elgatitolover.gif" style="width: 180px; border-radius: 12px; margin-bottom: 15px;" alt="Cute cat meme">
    
    <h2 id="main-text" style="color: #ff4d4d; font-size: 22px; margin-bottom: 25px;">Will you go on a date with me?</h2>

    <!-- Buttons Container -->
    <div style="position: relative; height: 80px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 20px;">
        <button onclick="acceptDate()" style="background-color: #4CAF50; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;">Yes! 🥰</button>
        
        <button id="no-btn" onmouseover="dodgeButton()" onclick="dodgeButton()" style="background-color: #f44336; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; position: absolute;">No 😢</button>
    </div>
</div>

<script>
function dodgeButton() {
    const noBtn = document.getElementById("no-btn");
    const randomX = (Math.random() - 0.5) * 200;
    const randomY = (Math.random() - 0.5) * 100;
    noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
}

function acceptDate() {
    const container = document.getElementById("meme-container");
    container.innerHTML = `
        <img src="https://media1.tenor.com/m/T1x841177ioAAAAC/peach-goma-happy.gif" style="width: 180px; border-radius: 12px; margin-bottom: 15px;" alt="Happy dance">
        <h2 style="color: #ff4d4d; font-size: 22px; margin-bottom: 15px;">Yay! Knew you'd say yes. 🥰</h2>
        <p style="font-size: 16px; color: #333; margin-bottom: 20px; font-weight: bold;">Choose your adventure:</p>
        <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
            <button onclick="alert('Dinner & Drinks it is! 🍷')" style="background: #ff4d4d; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 200px;">Fancy Dinner 🍝</button>
            <button onclick="alert('Movies and snacks locked in! 🍿')" style="background: #ff4d4d; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 200px;">Movies & Snacks 🎬</button>
            <button onclick="alert('Arcade/Activity showdown! 🕹️')" style="background: #ff4d4d; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 200px;">Arcade / Activity 🎳</button>
        </div>
    `;
}
</script>
